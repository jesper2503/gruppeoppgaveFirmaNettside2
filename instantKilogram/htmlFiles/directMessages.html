<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Direct Messages | InstaKG</title>

    <link rel="stylesheet" href="/cssFiles/index.css">
    <link rel="stylesheet" href="/cssFiles/directMessages.css">
</head>
<body>

    <main class="dmMain">

        <section class="dmPageHeading" aria-label="Direct messages heading">
            <div>
                <p class="dmEyebrow">INSTAKG INBOX</p>
                <h1>Messages</h1>
                <p class="dmHeadingDescription">Your conversations with the InstaKG bots.</p>
            </div>

            <a class="dmHomeLink" href="/index.html" aria-label="Return to homepage">
                <span aria-hidden="true">⌂</span>
                Home
            </a>
        </section>


        <section class="dmWorkspace" id="dmWorkspace" aria-label="Direct message inbox">

            <!-- LEFT: CONVERSATION LIST -->
            <aside class="dmSidebar" id="dmSidebar" aria-label="Your conversations">

                <div class="dmSidebarHeading">
                    <div>
                        <h2>Chats</h2>
                        <p>Choose someone to message</p>
                    </div>
                    <span class="dmChatCount" id="dmChatCount">5</span>
                </div>

                <label class="dmSearchWrap" for="dmSearchInput">
                    <span aria-hidden="true">⌕</span>
                    <input
                        type="search"
                        id="dmSearchInput"
                        placeholder="Search conversations"
                        autocomplete="off"
                    >
                </label>

                <nav class="dmChatList" id="dmChatList" aria-label="Bot conversations">
                    <!-- Conversation buttons are generated by directMessages.js -->
                </nav>

                <p class="dmStorageNote">
                    Your conversations are saved in this browser.
                </p>

            </aside>


            <!-- RIGHT: ACTIVE CONVERSATION -->
            <section class="dmConversation" id="dmConversation" aria-label="Conversation">

                <header class="dmConversationHeader">
                    <button
                        class="dmBackButton"
                        id="dmBackButton"
                        type="button"
                        aria-label="Back to conversations"
                    >
                        <span aria-hidden="true">←</span>
                    </button>

                    <img
                        class="dmActiveAvatar"
                        id="dmActiveAvatar"
                        src="/assets/profile_icon.png"
                        alt=""
                    >

                    <div class="dmActiveIdentity">
                        <h2 id="dmActiveName">Select a conversation</h2>
                        <p id="dmActiveStatus">InstaKG bot</p>
                    </div>

                    <a
                        class="dmProfileLink"
                        id="dmProfileLink"
                        href="/index.html"
                    >
                        View profile
                    </a>
                </header>


                <div
                    class="dmMessageList"
                    id="dmMessageList"
                    role="log"
                    aria-live="polite"
                    aria-relevant="additions text"
                    aria-label="Messages"
                >
                    <!-- Messages are generated by directMessages.js -->
                </div>


                <div class="dmTypingIndicator" id="dmTypingIndicator" hidden>
                    <span class="dmTypingDots" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span id="dmTypingText">Typing...</span>
                </div>


                <form class="dmComposer" id="dmComposer">
                    <label class="visuallyHidden" for="dmMessageInput">Write a message</label>
                    <textarea
                        id="dmMessageInput"
                        name="message"
                        rows="1"
                        maxlength="1200"
                        placeholder="Write a message..."
                        autocomplete="off"
                        required
                    ></textarea>

                    <button class="dmSendButton" id="dmSendButton" type="submit">
                        <span>Send</span>
                        <span aria-hidden="true">➤</span>
                    </button>

                    <p class="dmComposerHint" id="dmComposerHint">
                        Press Enter to send · Shift + Enter for a new line
                    </p>
                </form>

            </section>

        </section>

    </main>

    <script type="module" src="/jsFiles/navbar.js"></script>
    <script type="module" src="/jsFiles/directMessages.js"></script>

</body>
</html>
