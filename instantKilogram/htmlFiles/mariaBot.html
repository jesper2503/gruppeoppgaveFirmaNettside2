<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maria | InstaKG</title>

    <!-- Global styling -->
    <link rel="stylesheet" href="/cssFiles/index.css">

    <!-- Reuse the existing profile layout -->
    <link rel="stylesheet" href="/cssFiles/userPage.css">

    <!-- Bot-specific styling -->
    <link rel="stylesheet" href="/cssFiles/botPage.css">
</head>

<body data-bot-id="maria">

    <main>

        <!-- BOT PROFILE HEADER -->
        <header class="botProfileHeader">

            <div id="profilePicturePlacement">
                <!-- Bot profile picture is inserted by botPage.js -->
            </div>

            <div id="infoSection">

                <div class="userName">
                    <!-- Bot name is inserted by botPage.js -->
                </div>

                <div class="userStats">

                    <div class="userPosts userStatGap">
                        <p>Posts: 0</p>
                    </div>

                    <div class="userFollowers userStatGap">
                        <p>Followers: 0</p>
                    </div>

                    <div class="userFollowing userStatGap">
                        <p>Following: 0</p>
                    </div>

                </div>

                <div class="userBio">
                    <!-- Bot biography is inserted by botPage.js -->
                </div>

            </div>

            <div id="botActions" aria-label="Bot profile actions">
                <a
                    id="sendDmButton"
                    class="botActionButton dmButton"
                    href="/htmlFiles/directMessage.html"
                >
                    Send DM
                </a>

                <button
                    id="followButton"
                    class="botActionButton followButton"
                    type="button"
                    aria-pressed="false"
                >
                    Follow
                </button>
            </div>

        </header>


        <!-- BOT POSTS -->
        <section id="classPostSection" aria-label="Maria's posts">
            <!-- Posts and their interaction buttons are generated by botPage.js -->
        </section>


        <!-- COMMENTS DIALOG -->
        <dialog id="commentDialog" aria-labelledby="commentDialogTitle">

            <div class="dialogHeader">
                <h2 id="commentDialogTitle">Comments</h2>

                <button
                    id="closeCommentDialog"
                    type="button"
                    aria-label="Close comments"
                >
                    &times;
                </button>
            </div>

            <div class="commentDialogBody">

                <p id="commentPostCaption" class="commentPostCaption"></p>

                <div
                    id="commentList"
                    class="commentList"
                    aria-live="polite"
                    aria-label="Comment history"
                >
                    <!-- Comments are inserted by botPage.js -->
                </div>

                <form id="commentForm">

                    <label for="commentInput">Write a comment</label>

                    <textarea
                        id="commentInput"
                        maxlength="500"
                        rows="3"
                        placeholder="Write something..."
                        required
                    ></textarea>

                    <p id="commentStatus" role="status" aria-live="polite"></p>

                    <button type="submit" class="submitCommentButton">
                        Post comment
                    </button>

                </form>

            </div>

        </dialog>


        <!-- FULL-SIZE POST IMAGE DIALOG -->
        <dialog id="imageDialog" aria-label="Full-size post image">

            <button
                id="closeImageDialog"
                type="button"
                aria-label="Close full-size image"
            >
                &times;
            </button>

            <img id="expandedPostImage" alt="Expanded post image">

        </dialog>

    </main>


    <!-- JAVASCRIPT -->
    <script type="module" src="/jsFiles/navbar.js"></script>
    <script type="module" src="/jsFiles/botPage.js"></script>

</body>
</html>
